# 每项含 room、choice、selected_lights、brightness、color_temperature、units、occupancy_source、
# ambient_source、dark_enter_threshold、bright_exit_threshold、stability、minimum_hold、
# lamp_feedback_policy、relight_policy、manual_suppression_scope_and_release、missing/failed_sensor_policy。
modes: []
