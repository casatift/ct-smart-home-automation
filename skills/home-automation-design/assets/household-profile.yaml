# 空白规划模板，不是可部署的 HA 配置。复制到私有目录填写，不提交家庭资料。
# choice: not_discussed / proposed / confirmed / disabled
# null 表示未确定，不能自动当作 false、零、无人或同意；[] 不证明不存在设备/规则。
profile_version: 3
site:
  name: null
  installation: null
  core_version: null
  timezone: null
  agent_execution_location: null
  maintenance_connection: null # 只写连接类型，不写令牌/密码/配对码
  authorized_scope: null
household:
  residents_and_guests: []
  pets: []
  sleep_and_shift_preferences: []
  manual_control_preferences: []
implementation:
  preferred_engine: ha_native # 用户指定其他实现时覆盖，不默认迁移已有系统
  user_selected_engine: null
  shared_and_persistent_variables: ha_helpers
  helper_entities: [] # 含用途、类型、单位、范围、writer、恢复策略
mode_controls:
  business_mode_selectors: [] # 每轴 input_select、选项、界面入口、来源、实际状态、保持/恢复自动
  homekit_export_policy: include_user_modes_when_bridge_added
  explicit_export_exclusions: []
physical_devices: []
# 每项含 identity、area、integrations；capability 指定 reader、writer、feedback、health、fallback。
