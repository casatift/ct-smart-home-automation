  naps_and_shift_work: null
  night_visits_and_waking: null
  shared_bed_and_guests: null
  manual_hold_and_release: null
  missing_sensor_policy: null
  failed_sensor_policy: null
rooms: []
# 每项含 id、role、capabilities、shared_logic_ref、parameter_overrides、explicit_exceptions。
